<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>ログ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: #f5f4f1;
      color: #1a1a1a;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .header {
      padding: 14px 20px 12px;
      background: #fff;
      border-bottom: 1px solid #ece9e3;
      position: sticky; top: 0; z-index: 20;
    }
    .header-title { font-size: 22px; font-weight: 800; }
    .header-sub { font-size: 12px; color: #999; margin-top: 1px; }

    /* Date tabs */
    .date-tabs {
      display: flex;
      gap: 8px;
      padding: 12px 20px;
      overflow-x: auto;
      background: #fff;
      border-bottom: 1px solid #ece9e3;
      -webkit-overflow-scrolling: touch;
    }
    .date-tabs::-webkit-scrollbar { display: none; }
    .date-tab {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      background: #f0ede8;
      color: #888;
      border: none;
      font-family: inherit;
      touch-action: manipulation;
    }
    .date-tab.active { background: #52b788; color: white; }

    .content { padding: 16px 20px; }

    /* Summary cards */
    .summary-row { display: flex; gap: 10px; margin-bottom: 16px; }
    .summary-card {
      flex: 1;
      background: white;
      border-radius: 12px;
      padding: 14px 12px;
      text-align: center;
    }
    .summary-value { font-size: 24px; font-weight: 800; color: #2d6a4f; line-height: 1; }
    .summary-unit { font-size: 11px; color: #2d6a4f; font-weight: 600; }
    .summary-label { font-size: 10px; color: #bbb; margin-top: 4px; font-weight: 500; }

    /* Bar chart */
    .section-title {
      font-size: 11px;
      color: #bbb;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      margin-top: 4px;
    }

    .bar-chart { background: white; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .bar-row:last-child { margin-bottom: 0; }
    .bar-label {
      font-size: 12px;
      color: #555;
      width: 120px;
      flex-shrink: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bar-track {
      flex: 1;
      height: 8px;
      background: #f0ede8;
      border-radius: 4px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: #52b788;
      border-radius: 4px;
      transition: width 0.4s ease;
    }
    .bar-fill.over { background: #f39c12; }
    .bar-time {
      font-size: 11px;
      color: #999;
      width: 36px;
      text-align: right;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    /* Log entries */
    .log-list { display: flex; flex-direction: column; gap: 8px; }
    .log-entry {
      background: white;
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .log-icon {
      width: 36px; height: 36px;
      background: #eaf5ee;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .log-body { flex: 1; min-width: 0; }
    .log-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .log-meta { font-size: 11px; color: #bbb; margin-top: 2px; }
    .log-duration {
      font-size: 15px;
      font-weight: 700;
      color: #2d6a4f;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .empty-state {
      text-align: center;
      padding: 48px 0;
      color: #ccc;
    }
    .empty-state-icon { font-size: 40px; margin-bottom: 10px; }
    .empty-state-text { font-size: 13px; }

    /* Clear button */
    .clear-btn {
      background: none;
      border: 1.5px solid #e0dcd5;
      color: #bbb;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }

    /* Top nav */
    .top-nav {
      display: flex;
      background: #fff;
      border-bottom: 1px solid #ece9e3;
      flex-shrink: 0;
    }
    .nav-item {
      flex: 1;
      padding: 10px 0 8px;
      text-align: center;
      text-decoration: none;
      color: #bbb;
      font-size: 12px;
      font-weight: 600;
      border-bottom: 2px solid transparent;
      letter-spacing: 0.3px;
    }
    .nav-item.active { color: #52b788; border-bottom-color: #52b788; }
    .nav-item:hover:not(.active) { color: #888; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-title">ログ</div>
    <div class="header-sub" id="headerSub">—</div>
  </div>

  <div class="date-tabs" id="dateTabs"></div>

  <div class="content" id="content"></div>

  <nav class="top-nav">
    <a class="nav-item" href="index.html">📅 Today</a>
    <a class="nav-item active" href="log.html">📊 ログ</a>
    <a class="nav-item" href="sync.html">📋 インポート</a>
  </nav>

<script>
const CATEGORIES = {
  work:     { label: '仕事',  color: '#27ae60', bg: '#eafaf1' },
  study:    { label: '勉強',  color: '#e74c3c', bg: '#fdedec' },
  exercise: { label: '運動',  color: '#f39c12', bg: '#fef9e7' },
  break:    { label: '休憩',  color: '#3498db', bg: '#eaf4fb' },
  personal: { label: '個人',  color: '#9b59b6', bg: '#f5eef8' },
  other:    { label: 'その他', color: '#7f8c8d', bg: '#f2f3f4' },
};

const DB = {
  getLog: () => JSON.parse(localStorage.getItem('dp_log') || '[]'),
  clearLog: date => {
    const log = JSON.parse(localStorage.getItem('dp_log') || '[]').filter(e => e.date !== date);
    localStorage.setItem('dp_log', JSON.stringify(log));
  },
  getTasks: () => JSON.parse(localStorage.getItem('dp_tasks') || '[]'),
};

let selectedDate = new Date().toISOString().slice(0, 10);

function getAvailableDates() {
  const log = DB.getLog();
  const tasks = DB.getTasks();
  const dates = new Set([
    ...log.map(e => e.date),
    ...tasks.map(t => t.date),
    new Date().toISOString().slice(0, 10)
  ]);
  return Array.from(dates).sort().reverse().slice(0, 14);
}

function formatDateLabel(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const today = new Date().toISOString().slice(0, 10);
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  const days = ['日','月','火','水','木','金','土'];
  if (dateStr === today) return '今日';
  if (dateStr === yesterday) return '昨日';
  return `${d.getMonth()+1}/${d.getDate()}(${days[d.getDay()]})`;
}

function formatMins(mins) {
  if (mins < 60) return `${mins}m`;
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return m > 0 ? `${h}h${m}m` : `${h}h`;
}

function renderTabs() {
  const dates = getAvailableDates();
  const tabs = document.getElementById('dateTabs');
  tabs.innerHTML = dates.map(d => `
    <button class="date-tab ${d === selectedDate ? 'active' : ''}" onclick="selectDate('${d}')">
      ${formatDateLabel(d)}
    </button>
  `).join('');
}

function selectDate(date) {
  selectedDate = date;
  renderTabs();
  renderContent();
}

function renderContent() {
  const log = DB.getLog().filter(e => e.date === selectedDate);
  const tasks = DB.getTasks().filter(t => t.date === selectedDate);
  const content = document.getElementById('content');

  const d = new Date(selectedDate + 'T00:00:00');
  const days = ['日','月','火','水','木','金','土'];
  document.getElementById('headerSub').textContent =
    `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}（${days[d.getDay()]}）`;

  if (log.length === 0 && tasks.length === 0) {
    content.innerHTML = `<div class="empty-state">
      <div class="empty-state-icon">📭</div>
      <div class="empty-state-text">この日のログはありません</div>
    </div>`;
    return;
  }

  const totalMins = log.reduce((s, e) => s + (e.duration || 0), 0);
  const completedTasks = tasks.filter(t => t.completed).length;
  const totalTasks = tasks.length;

  // Summary cards
  const hh = Math.floor(totalMins / 60);
  const mm = totalMins % 60;
  const timeDisplay = hh > 0 ? `${hh}<span class="summary-unit">h</span>${mm}` : `${mm}`;
  const timeUnit = hh > 0 ? 'm' : 'min';

  let html = `
    <div class="summary-row">
      <div class="summary-card">
        <div class="summary-value">${timeDisplay}<span class="summary-unit">${timeUnit}</span></div>
        <div class="summary-label">合計時間</div>
      </div>
      <div class="summary-card">
        <div class="summary-value">${completedTasks}<span class="summary-unit"> / ${totalTasks}</span></div>
        <div class="summary-label">完了タスク</div>
      </div>
    </div>
  `;

  // Category chart
  if (log.length > 0) {
    const catTotals = {};
    log.forEach(e => {
      const key = e.category || 'other';
      catTotals[key] = (catTotals[key] || 0) + (e.duration || 0);
    });
    const catEntries = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);
    const maxCat = Math.max(...catEntries.map(([,v]) => v), 1);

    html += `<div class="section-title">カテゴリ別</div><div class="bar-chart">`;
    catEntries.forEach(([key, mins]) => {
      const cat = CATEGORIES[key] || CATEGORIES.other;
      const pct = Math.round((mins / maxCat) * 100);
      const totalPct = totalMins > 0 ? Math.round((mins / totalMins) * 100) : 0;
      html += `
        <div class="bar-row">
          <div class="bar-label" style="display:flex;align-items:center;gap:6px">
            <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${cat.color};flex-shrink:0"></span>
            ${cat.label}
          </div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${cat.color}"></div></div>
          <div class="bar-time">${formatMins(mins)}<span style="color:#ccc;font-size:9px;margin-left:2px">${totalPct}%</span></div>
        </div>`;
    });
    html += `</div>`;
  }

  // Bar chart (top tasks by duration)
  if (log.length > 0) {
    const maxDur = Math.max(...log.map(e => e.duration || 0), 1);
    html += `<div class="section-title">タスク別</div>
    <div class="bar-chart">`;
    log.slice().sort((a, b) => (b.duration || 0) - (a.duration || 0)).forEach(entry => {
      const pct = Math.round(((entry.duration || 0) / maxDur) * 100);
      const over = entry.scheduled && entry.duration > entry.scheduled * 1.2;
      const cat = entry.category ? CATEGORIES[entry.category] : null;
      const barColor = cat ? cat.color : (over ? '#f39c12' : '#52b788');
      html += `
        <div class="bar-row">
          <div class="bar-label">${entry.title}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${barColor}"></div></div>
          <div class="bar-time">${formatMins(entry.duration || 0)}</div>
        </div>`;
    });
    html += `</div>`;
  }

  // Log entries
  if (log.length > 0) {
    html += `<div class="section-title">詳細</div><div class="log-list">`;
    log.slice().reverse().forEach(entry => {
      const start = new Date(entry.startTime);
      const hh = String(start.getHours()).padStart(2,'0');
      const mm = String(start.getMinutes()).padStart(2,'0');
      const diff = entry.scheduled ? ` / 予定${formatMins(entry.scheduled)}` : '';
      const cat = entry.category ? CATEGORIES[entry.category] : null;
      const catBadge = cat ? `<span style="background:${cat.bg};color:${cat.color};border-radius:10px;padding:1px 7px;font-size:10px;font-weight:600;margin-left:4px">${cat.label}</span>` : '';
      html += `
        <div class="log-entry">
          <div class="log-icon" style="${cat ? `background:${cat.bg};color:${cat.color}` : ''}">⏱</div>
          <div class="log-body">
            <div class="log-title">${entry.title}${catBadge}</div>
            <div class="log-meta">${hh}:${mm} 開始${diff}</div>
          </div>
          <div class="log-duration" style="${cat ? `color:${cat.color}` : ''}">${formatMins(entry.duration || 0)}</div>
        </div>`;
    });
    html += `</div>`;

    html += `<div style="text-align:center;margin-top:20px">
      <button class="clear-btn" onclick="clearDay()">この日のログを削除</button>
    </div>`;
  }

  content.innerHTML = html;
}

function clearDay() {
  if (!confirm(`${formatDateLabel(selectedDate)}のログを削除しますか？`)) return;
  DB.clearLog(selectedDate);
  renderTabs();
  renderContent();
}

renderTabs();
renderContent();
</script>
</body>
</html>
