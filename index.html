<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Today — プランナー</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: #f5f4f1;
      color: #1a1a1a;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .header {
      padding: 14px 24px 10px;
      background: #fff;
      border-bottom: 1px solid #ece9e3;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .header-left {}
    .header-date { font-size: 11px; color: #aaa; letter-spacing: 0.5px; }
    .header-title { font-size: 22px; font-weight: 800; }
    .header-stats { font-size: 12px; color: #52b788; margin-top: 1px; font-weight: 500; }
    .header-right { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
    .add-btn {
      background: #52b788; color: white; border: none;
      border-radius: 8px; padding: 8px 16px; font-size: 13px;
      font-weight: 700; cursor: pointer; font-family: inherit;
      flex-shrink: 0;
    }
    .add-btn:hover { background: #40a372; }
    .zoom-btn {
      background: #f0ede8; color: #555; border: none;
      border-radius: 6px; width: 30px; height: 30px;
      font-size: 16px; cursor: pointer; font-family: inherit;
      display: flex; align-items: center; justify-content: center;
    }
    .zoom-btn:hover { background: #e0dcd5; }
    .zoom-label { font-size: 11px; color: #aaa; font-weight: 600; min-width: 28px; text-align: center; }

    /* Top nav */
    .top-nav {
      display: flex; background: #fff;
      border-bottom: 1px solid #ece9e3; flex-shrink: 0;
    }
    .nav-item {
      flex: 1; padding: 10px 0 8px; text-align: center;
      text-decoration: none; color: #bbb; font-size: 12px; font-weight: 600;
      border-bottom: 2px solid transparent; letter-spacing: 0.3px;
    }
    .nav-item.active { color: #52b788; border-bottom-color: #52b788; }
    .nav-item:hover:not(.active) { color: #888; }

    /* Active banner */
    .active-banner {
      background: #2d6a4f; color: white; padding: 8px 24px;
      display: none; align-items: center; justify-content: space-between;
      flex-shrink: 0; cursor: pointer;
    }
    .active-banner.visible { display: flex; }
    .banner-task { font-size: 13px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .banner-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .banner-timer { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .banner-timer.overtime { color: #fca311; }
    .banner-stop {
      font-size: 11px; background: rgba(255,255,255,0.2); border: none;
      color: white; border-radius: 6px; padding: 3px 10px;
      cursor: pointer; font-weight: 600; font-family: inherit;
    }

    /* ===== 2-COLUMN LAYOUT ===== */
    .main-layout {
      flex: 1; display: flex; overflow: hidden;
    }
    .left-col {
      flex: 1; overflow: hidden; display: flex; flex-direction: column; min-width: 0;
    }
    .right-col {
      width: 300px; flex-shrink: 0;
      border-left: 1px solid #ece9e3;
      background: #fff;
      overflow-y: auto;
      display: flex; flex-direction: column;
    }
    @media (max-width: 860px) {
      .right-col { display: none; }
    }

    /* Timeline */
    .timeline-container {
      flex: 1; overflow-y: auto; position: relative;
    }
    .timeline {
      position: relative; margin-left: 56px; margin-right: 16px;
      max-width: 680px; height: 1440px;
    }

    /* Hour lines */
    .hour-line {
      position: absolute; left: -56px; right: 0;
      display: flex; align-items: flex-start; pointer-events: none;
    }
    .hour-label {
      width: 48px; font-size: 10px; color: #bbb; text-align: right;
      padding-right: 8px; line-height: 1; margin-top: -5px;
      flex-shrink: 0; font-variant-numeric: tabular-nums;
    }
    .hour-tick { flex: 1; border-top: 1px solid #e8e4dd; }
    .hour-line.half .hour-tick { border-top-style: dashed; border-top-color: #f0ece6; }

    /* Now line */
    .now-line {
      position: absolute; left: -56px; right: 0;
      display: flex; align-items: center; pointer-events: none; z-index: 10;
    }
    .now-dot { width: 9px; height: 9px; background: #e74c3c; border-radius: 50%; margin-left: 43px; flex-shrink: 0; }
    .now-tick { flex: 1; border-top: 2px solid #e74c3c; }

    /* Task blocks */
    .task-block {
      position: absolute; left: 3px; right: 0;
      border-radius: 7px; padding: 4px 10px; cursor: grab; min-height: 28px;
      display: flex; flex-direction: column; justify-content: center;
      z-index: 5; transition: transform 0.1s, box-shadow 0.1s;
    }
    .task-block:hover { transform: translateX(1px); box-shadow: 0 1px 6px rgba(0,0,0,0.08); }
    .task-block.pending { background: #eaf5ee; border-left: 3px solid #74c69d; }
    .task-block.running { background: #52b788; border-left: 3px solid #2d6a4f; box-shadow: 0 2px 10px rgba(82,183,136,0.35); }
    .task-block.running .task-title,
    .task-block.running .task-meta { color: white; }
    .task-block.completed { background: #f0ede8; border-left: 3px solid #d4cec5; }
    .task-block.skipped { background: #f5f4f1; border-left: 3px solid #e0dcd5; }
    .task-title { font-size: 12px; font-weight: 600; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .task-meta { font-size: 10px; color: #999; margin-top: 1px; }
    .task-block.completed .task-title { text-decoration: line-through; color: #bbb; }
    .task-block.skipped .task-title { color: #ccc; }

    /* Resize handle */
    .resize-handle {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 10px; cursor: ns-resize; border-radius: 0 0 7px 7px;
      display: flex; align-items: center; justify-content: center;
    }
    .resize-handle::after {
      content: ''; width: 20px; height: 2px;
      background: rgba(0,0,0,0.18); border-radius: 1px;
    }
    .task-block.completed .resize-handle,
    .task-block.skipped .resize-handle { display: none; }

    /* ===== STATS PANEL ===== */
    .stats-panel { display: flex; flex-direction: column; flex: 1; }

    .stats-tabs {
      display: flex; border-bottom: 1px solid #ece9e3; flex-shrink: 0;
    }
    .stats-tab {
      flex: 1; padding: 11px 0 9px; border: none; background: none;
      font-size: 12px; font-weight: 600; color: #bbb; cursor: pointer;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      font-family: inherit; letter-spacing: 0.3px;
    }
    .stats-tab.active { color: #52b788; border-bottom-color: #52b788; }
    .stats-tab:hover:not(.active) { color: #888; }

    .stats-body { padding: 16px; flex: 1; }

    .stats-period {
      font-size: 10px; color: #ccc; font-weight: 600;
      letter-spacing: 0.4px; margin-bottom: 8px;
    }
    .stats-total-value {
      font-size: 32px; font-weight: 200; color: #1a1a1a;
      letter-spacing: -0.5px; line-height: 1;
      margin-bottom: 4px; font-variant-numeric: tabular-nums;
    }
    .stats-total-sub {
      font-size: 11px; color: #bbb; margin-bottom: 20px;
    }

    /* Mini trend bars (week / month) */
    .trend-section { margin-bottom: 20px; }
    .trend-label { font-size: 10px; color: #ccc; font-weight: 600; letter-spacing: 0.4px; margin-bottom: 8px; }
    .trend-bars {
      display: flex; align-items: flex-end; gap: 3px;
      height: 52px;
    }
    .trend-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; }
    .trend-bar-wrap { flex: 1; width: 100%; display: flex; align-items: flex-end; }
    .trend-bar-fill {
      width: 100%; background: #b7e4c7; border-radius: 3px 3px 0 0;
      min-height: 2px; transition: height 0.3s ease;
    }
    .trend-bar-fill.is-today { background: #52b788; }
    .trend-bar-fill.is-this-week { background: #74c69d; }
    .trend-bar-lbl { font-size: 9px; color: #ccc; margin-top: 4px; font-weight: 600; }
    .trend-bar-lbl.is-today { color: #52b788; }
    .trend-bar-lbl.is-this-week { color: #74c69d; }

    /* Category rows */
    .cat-section-label { font-size: 10px; color: #ccc; font-weight: 600; letter-spacing: 0.4px; margin-bottom: 10px; }
    .cat-row { margin-bottom: 12px; }
    .cat-row-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;
    }
    .cat-row-name {
      font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px;
    }
    .cat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .cat-row-time {
      font-size: 11px; color: #888; font-variant-numeric: tabular-nums;
    }
    .cat-row-pct { font-size: 10px; color: #ccc; margin-left: 4px; }
    .cat-bar-bg { height: 5px; background: #f0ede8; border-radius: 3px; overflow: hidden; }
    .cat-bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }

    .stats-empty {
      text-align: center; padding: 40px 0;
      font-size: 12px; color: #ccc;
    }
    .stats-empty-icon { font-size: 28px; margin-bottom: 8px; opacity: 0.3; }

    /* Category picker */
    .cat-picker { display: flex; flex-wrap: wrap; gap: 6px; }
    .cat-pill {
      padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
      border: 2px solid #e0dcd5; background: white; cursor: pointer;
      font-family: inherit; color: #888; transition: all 0.15s;
    }
    .cat-pill:hover { opacity: 0.8; }
    .cat-pill.selected { color: white; }

    /* Modal overlay */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      z-index: 100; display: none; align-items: center; justify-content: center;
    }
    .overlay.visible { display: flex; }
    .sheet {
      background: white; width: 440px; max-width: calc(100vw - 40px);
      border-radius: 16px; padding: 28px;
      animation: popIn 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 8px 40px rgba(0,0,0,0.18);
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.95); }
      to   { opacity: 1; transform: scale(1); }
    }
    .sheet-title { font-size: 17px; font-weight: 700; margin-bottom: 2px; }
    .sheet-subtitle { font-size: 12px; color: #999; margin-bottom: 16px; }
    .timer-display {
      text-align: center; font-size: 60px; font-weight: 200;
      font-variant-numeric: tabular-nums; color: #2d6a4f;
      margin: 8px 0 20px; letter-spacing: 2px; line-height: 1;
    }
    .timer-display.overtime { color: #e67e22; }
    .timer-label {
      text-align: center; font-size: 11px; color: #bbb;
      margin-top: -16px; margin-bottom: 20px; font-weight: 600; letter-spacing: 0.5px;
    }
    .sheet-buttons { display: flex; gap: 10px; }
    .btn {
      flex: 1; padding: 13px 8px; border: none; border-radius: 10px;
      font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
      transition: opacity 0.15s, background 0.1s;
    }
    .btn:hover { opacity: 0.88; }
    .btn-primary { background: #52b788; color: white; }
    .btn-success { background: #2d6a4f; color: white; }
    .btn-muted { background: #f0ede8; color: #888; flex: 0 0 80px; }
    .btn-skip { background: #f0ede8; color: #aaa; }

    /* Add task form */
    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 11px; color: #999; margin-bottom: 4px; display: block; font-weight: 600; letter-spacing: 0.3px; }
    .form-input {
      width: 100%; padding: 10px 12px; border: 1.5px solid #e8e4dd;
      border-radius: 8px; font-size: 14px; outline: none;
      font-family: inherit; background: #faf9f7; transition: border-color 0.15s;
    }
    .form-input:focus { border-color: #52b788; background: #fff; }
    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; }

    /* Empty state */
    .empty-state {
      position: absolute; top: 45%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center; pointer-events: none;
    }
    .empty-state-icon { font-size: 36px; margin-bottom: 8px; opacity: 0.25; }
    .empty-state-text { font-size: 12px; color: #ccc; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <div class="header-date" id="headerDate"></div>
      <div class="header-title">Today</div>
      <div class="header-stats" id="headerStats"></div>
    </div>
    <div class="header-right">
      <button class="zoom-btn" onclick="changeZoom(-1)">－</button>
      <span class="zoom-label" id="zoomLabel">1x</span>
      <button class="zoom-btn" onclick="changeZoom(+1)">＋</button>
      <button class="add-btn" onclick="openAddSheet()">＋ タスク追加</button>
    </div>
  </div>

  <nav class="top-nav">
    <a class="nav-item active" href="index.html">📅 Today</a>
    <a class="nav-item" href="log.html">📊 ログ</a>
    <a class="nav-item" href="sync.html">📋 インポート</a>
  </nav>

  <div class="active-banner" id="activeBanner" onclick="reopenActiveTask()">
    <span class="banner-task" id="bannerTask">—</span>
    <div class="banner-right">
      <span class="banner-timer" id="bannerTimer">00:00</span>
      <button class="banner-stop" onclick="event.stopPropagation(); completeActive()">✓ 完了</button>
    </div>
  </div>

  <div class="main-layout">
    <div class="left-col">
      <div class="timeline-container" id="timelineContainer">
        <div class="timeline" id="timeline"></div>
      </div>
    </div>
    <div class="right-col">
      <div class="stats-panel">
        <div class="stats-tabs">
          <button class="stats-tab active" data-tab="day"  onclick="switchStatsTab('day')">日次</button>
          <button class="stats-tab"        data-tab="week" onclick="switchStatsTab('week')">週次</button>
          <button class="stats-tab"        data-tab="month" onclick="switchStatsTab('month')">月次</button>
        </div>
        <div class="stats-body" id="statsBody"></div>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay" onclick="handleOverlayClick(event)">
    <div class="sheet" id="sheet">
      <div id="sheetContent"></div>
    </div>
  </div>

<script>
const TODAY = new Date().toISOString().slice(0, 10);

const DB = {
  getTasks: () => JSON.parse(localStorage.getItem('dp_tasks') || '[]'),
  saveTasks: t => localStorage.setItem('dp_tasks', JSON.stringify(t)),
  getTimer: () => JSON.parse(localStorage.getItem('dp_timer') || 'null'),
  saveTimer: s => s ? localStorage.setItem('dp_timer', JSON.stringify(s)) : localStorage.removeItem('dp_timer'),
  getLog: () => JSON.parse(localStorage.getItem('dp_log') || '[]'),
  addLog: e => { const l = DB.getLog(); l.push(e); localStorage.setItem('dp_log', JSON.stringify(l)); },
};

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pad = n => String(n).padStart(2, '0');
const fmtMins = m => m >= 60 ? `${Math.floor(m/60)}h ${m%60 ? (m%60)+'m' : ''}`.trim() : `${m}m`;

// ===== ZOOM =====
const ZOOM_LEVELS = [0.5, 1, 1.5, 2, 3];
let zoomIndex = parseInt(localStorage.getItem('dp_zoom') || '1');
const PX_PER_MIN = () => ZOOM_LEVELS[zoomIndex];

function changeZoom(delta) {
  zoomIndex = Math.max(0, Math.min(ZOOM_LEVELS.length - 1, zoomIndex + delta));
  localStorage.setItem('dp_zoom', zoomIndex);
  document.getElementById('zoomLabel').textContent = ZOOM_LEVELS[zoomIndex] + 'x';
  buildTimeline();
  scrollToNow();
}

const CATEGORIES = {
  work:     { label: '仕事',   color: '#27ae60', bg: '#eafaf1' },
  study:    { label: '勉強',   color: '#e74c3c', bg: '#fdedec' },
  exercise: { label: '運動',   color: '#f39c12', bg: '#fef9e7' },
  break:    { label: '休憩',   color: '#3498db', bg: '#eaf4fb' },
  personal: { label: '個人',   color: '#9b59b6', bg: '#f5eef8' },
  other:    { label: 'その他', color: '#7f8c8d', bg: '#f2f3f4' },
};

// ===== TIMELINE =====
function buildTimeline() {
  const tl = document.getElementById('timeline');
  tl.innerHTML = '';
  const Z = PX_PER_MIN();
  tl.style.height = (1440 * Z) + 'px';
  document.getElementById('zoomLabel').textContent = Z + 'x';

  for (let h = 0; h < 24; h++) {
    const y = h * 60 * Z;
    const hl = mkEl('div', 'hour-line', `<span class="hour-label">${pad(h)}:00</span><div class="hour-tick"></div>`);
    hl.style.top = y + 'px';
    tl.appendChild(hl);
    const hl2 = mkEl('div', 'hour-line half', `<span class="hour-label"></span><div class="hour-tick"></div>`);
    hl2.style.top = (y + 30 * Z) + 'px';
    tl.appendChild(hl2);
  }

  const tasks = DB.getTasks().filter(t => t.date === TODAY);
  tasks.sort((a, b) => a.scheduledTime.localeCompare(b.scheduledTime));

  if (tasks.length === 0) {
    tl.appendChild(mkEl('div', 'empty-state', `<div class="empty-state-icon">🗓</div><div class="empty-state-text">「タスク追加」からタスクを追加してください</div>`));
  }

  const timer = DB.getTimer();
  tasks.forEach(t => {
    const isRunning = timer && timer.taskId === t.id;
    const [h, m] = t.scheduledTime.split(':').map(Number);
    const top = (h * 60 + m) * Z;
    const height = Math.max((t.duration || 30) * Z, 28);
    const cls = t.completed ? 'completed' : t.skipped ? 'skipped' : isRunning ? 'running' : 'pending';
    const icon = t.completed ? ' ✓' : t.skipped ? ' —' : '';
    const block = mkEl('div', `task-block ${cls}`);
    block.style.top = top + 'px';
    block.style.height = height + 'px';

    const cat = t.category ? CATEGORIES[t.category] : null;
    if (cat && !t.completed && !t.skipped && !isRunning) {
      block.style.background = cat.bg;
      block.style.borderLeftColor = cat.color;
    }

    const catDot = cat ? `<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${cat.color};margin-right:4px;vertical-align:middle;"></span>` : '';
    block.innerHTML = `<div class="task-title">${catDot}${t.title}</div><div class="task-meta">${t.scheduledTime} · ${t.duration}分${icon}</div>`;

    addDragBehavior(block, t.id, top);
    if (!t.completed && !t.skipped) addResizeBehavior(block, t.id, height);
    tl.appendChild(block);
  });

  placeNowLine(tl);
}

function placeNowLine(container) {
  document.querySelector('.now-line')?.remove();
  const now = new Date();
  const mins = now.getHours() * 60 + now.getMinutes();
  const Z = PX_PER_MIN();
  const line = mkEl('div', 'now-line', `<div class="now-dot"></div><div class="now-tick"></div>`);
  line.style.top = (mins * Z) + 'px';
  (container || document.getElementById('timeline')).appendChild(line);
}

function scrollToNow() {
  const Z = PX_PER_MIN();
  const nowMins = new Date().getHours() * 60 + new Date().getMinutes();
  document.getElementById('timelineContainer').scrollTop = Math.max(0, nowMins * Z - 120);
}

// ===== HEADER =====
function updateHeader() {
  const now = new Date();
  const days = ['日','月','火','水','木','金','土'];
  document.getElementById('headerDate').textContent =
    `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}（${days[now.getDay()]}）`;
  const tasks = DB.getTasks().filter(t => t.date === TODAY);
  const done = tasks.filter(t => t.completed || t.skipped).length;
  document.getElementById('headerStats').textContent =
    tasks.length > 0 ? `${done} / ${tasks.length} 完了` : 'タスクなし';
}

// ===== STATS PANEL =====
let statsTab = 'day';

function switchStatsTab(tab) {
  statsTab = tab;
  document.querySelectorAll('.stats-tab').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  renderStats();
}

function getDateRange(tab) {
  const now = new Date();
  const today = now.toISOString().slice(0, 10);
  if (tab === 'day') return [today, today];
  if (tab === 'week') {
    const dow = now.getDay();
    const mon = new Date(now);
    mon.setDate(now.getDate() - ((dow + 6) % 7));
    mon.setHours(0, 0, 0, 0);
    const sun = new Date(mon);
    sun.setDate(mon.getDate() + 6);
    return [mon.toISOString().slice(0, 10), sun.toISOString().slice(0, 10)];
  }
  if (tab === 'month') {
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const lastDay = new Date(y, now.getMonth() + 1, 0).getDate();
    return [`${y}-${m}-01`, `${y}-${m}-${String(lastDay).padStart(2, '0')}`];
  }
}

function buildTrendBars(from, to, granularity) {
  const logs = DB.getLog();
  const cols = [];

  if (granularity === 'day') {
    const DAY_JP = ['月','火','水','木','金','土','日'];
    let d = new Date(from + 'T00:00:00');
    const end = new Date(to + 'T00:00:00');
    let idx = 0;
    while (d <= end) {
      const dateStr = d.toISOString().slice(0, 10);
      const mins = logs.filter(e => e.date === dateStr).reduce((s, e) => s + (e.duration || 0), 0);
      const dow = d.getDay();
      cols.push({ label: DAY_JP[(dow + 6) % 7], mins, isToday: dateStr === TODAY });
      d.setDate(d.getDate() + 1);
      idx++;
    }
  } else {
    // granularity === 'week' (for monthly view: show weekly totals)
    let d = new Date(from + 'T00:00:00');
    const end = new Date(to + 'T00:00:00');
    let weekIdx = 1;
    while (d <= end) {
      const weekStart = d.toISOString().slice(0, 10);
      const weekEnd = new Date(d);
      weekEnd.setDate(d.getDate() + 6);
      const weekEndStr = weekEnd > end ? to : weekEnd.toISOString().slice(0, 10);
      const mins = logs.filter(e => e.date >= weekStart && e.date <= weekEndStr)
        .reduce((s, e) => s + (e.duration || 0), 0);
      const containsToday = TODAY >= weekStart && TODAY <= weekEndStr;
      cols.push({ label: `W${weekIdx}`, mins, isToday: containsToday });
      d.setDate(d.getDate() + 7);
      weekIdx++;
    }
  }

  if (cols.every(c => c.mins === 0)) return '';

  const maxMins = Math.max(...cols.map(c => c.mins), 1);
  const bars = cols.map(c => {
    const h = Math.max(2, Math.round((c.mins / maxMins) * 44));
    const cls = c.isToday ? 'is-today' : '';
    return `<div class="trend-bar-col">
      <div class="trend-bar-wrap"><div class="trend-bar-fill ${cls}" style="height:${h}px"></div></div>
      <div class="trend-bar-lbl ${cls}">${c.label}</div>
    </div>`;
  }).join('');

  return `<div class="trend-section">
    <div class="trend-label">${granularity === 'day' ? '曜日別' : '週別'} 作業時間</div>
    <div class="trend-bars">${bars}</div>
  </div>`;
}

function renderStats() {
  const body = document.getElementById('statsBody');
  if (!body) return;

  const [from, to] = getDateRange(statsTab);
  const logs = DB.getLog().filter(e => e.date >= from && e.date <= to);

  const totals = {};
  let grandTotal = 0;
  logs.forEach(e => {
    const cat = e.category || 'other';
    totals[cat] = (totals[cat] || 0) + (e.duration || 0);
    grandTotal += (e.duration || 0);
  });

  const periodLabels = {
    day: '今日',
    week: '今週',
    month: '今月',
  };

  const now = new Date();
  let periodSub = '';
  if (statsTab === 'week') {
    const [f, t] = getDateRange('week');
    periodSub = `${f.slice(5).replace('-','/')} 〜 ${t.slice(5).replace('-','/')}`;
  } else if (statsTab === 'month') {
    periodSub = `${now.getFullYear()}年${now.getMonth()+1}月`;
  } else {
    const days = ['日','月','火','水','木','金','土'];
    periodSub = `${now.getMonth()+1}/${now.getDate()}（${days[now.getDay()]}）`;
  }

  if (grandTotal === 0) {
    body.innerHTML = `
      <div class="stats-period">${periodLabels[statsTab]}　${periodSub}</div>
      <div class="stats-empty">
        <div class="stats-empty-icon">📊</div>
        まだ記録がありません
      </div>`;
    return;
  }

  const sorted = Object.entries(totals).sort((a, b) => b[1] - a[1]);

  const trendHTML = statsTab === 'week'
    ? buildTrendBars(from, to, 'day')
    : statsTab === 'month'
    ? buildTrendBars(from, to, 'week')
    : '';

  const catRows = sorted.map(([key, mins]) => {
    const cat = CATEGORIES[key] || CATEGORIES.other;
    const pct = Math.round((mins / grandTotal) * 100);
    return `<div class="cat-row">
      <div class="cat-row-header">
        <span class="cat-row-name">
          <span class="cat-dot" style="background:${cat.color}"></span>
          ${cat.label}
        </span>
        <span class="cat-row-time">${fmtMins(mins)}<span class="cat-row-pct">${pct}%</span></span>
      </div>
      <div class="cat-bar-bg">
        <div class="cat-bar-fill" style="width:${pct}%;background:${cat.color}"></div>
      </div>
    </div>`;
  }).join('');

  body.innerHTML = `
    <div class="stats-period">${periodLabels[statsTab]}　${periodSub}</div>
    <div class="stats-total-value">${fmtMins(grandTotal)}</div>
    <div class="stats-total-sub">${logs.length}件のログ</div>
    ${trendHTML}
    <div class="cat-section-label">カテゴリ別</div>
    ${catRows}
  `;
}

// ===== TIMER =====
let timerTick = null;

function startTicking() {
  clearInterval(timerTick);
  timerTick = setInterval(tickTimer, 1000);
}

function tickTimer() {
  const state = DB.getTimer();
  if (!state) {
    clearInterval(timerTick);
    document.getElementById('activeBanner').classList.remove('visible');
    return;
  }
  const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
  const remaining = (state.scheduledSecs || 0) - elapsed;
  const isOvertime = remaining < 0;
  const display = isOvertime ? '+' + formatSecs(-remaining) : formatSecs(remaining);

  const banner = document.getElementById('activeBanner');
  banner.classList.add('visible');
  const timerEl = document.getElementById('bannerTimer');
  timerEl.textContent = display;
  timerEl.className = 'banner-timer' + (isOvertime ? ' overtime' : '');

  const task = DB.getTasks().find(t => t.id === state.taskId);
  if (task) document.getElementById('bannerTask').textContent = task.title;

  const sheetTimer = document.getElementById('sheetTimer');
  if (sheetTimer) {
    sheetTimer.textContent = display;
    sheetTimer.className = 'timer-display' + (isOvertime ? ' overtime' : '');
    const lbl = document.getElementById('timerLabel');
    if (lbl) lbl.textContent = isOvertime ? '超過中' : '残り時間';
  }
}

function formatSecs(s) {
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return h > 0 ? `${h}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
}

// ===== TASK ACTIONS =====
function startTask(taskId) {
  const tasks = DB.getTasks();
  const task = tasks.find(t => t.id === taskId);
  const existing = DB.getTimer();
  if (existing) stopTimer(existing.taskId, false);
  DB.saveTimer({ taskId, startTime: Date.now(), scheduledSecs: (task?.duration || 30) * 60 });
  closeSheet(); buildTimeline(); startTicking();
  setTimeout(() => openTaskSheet(taskId), 60);
}

function completeTask(taskId) {
  const state = DB.getTimer();
  const now = Date.now();
  const elapsed = state ? Math.floor((now - state.startTime) / 1000) : 0;
  const tasks = DB.getTasks();
  const task = tasks.find(t => t.id === taskId);
  if (task) {
    if (elapsed > 0) {
      DB.addLog({
        id: uid(), taskId, title: task.title, date: TODAY,
        category: task.category || null,
        startTime: state?.startTime || now, endTime: now,
        duration: Math.max(1, Math.ceil(elapsed / 60)),
        scheduled: task.duration
      });
    }
    task.completed = true;
    task.actualDuration = Math.max(1, Math.ceil(elapsed / 60));
    DB.saveTasks(tasks);
  }
  DB.saveTimer(null);
  clearInterval(timerTick);
  document.getElementById('activeBanner').classList.remove('visible');
  closeSheet(); buildTimeline(); updateHeader(); renderStats();
}

function completeActive() {
  const state = DB.getTimer();
  if (state) completeTask(state.taskId);
}

function reopenActiveTask() {
  const state = DB.getTimer();
  if (state) openTaskSheet(state.taskId);
}

function stopTimer(taskId, logIt = true) {
  const state = DB.getTimer();
  if (!state) return;
  if (logIt) {
    const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
    if (elapsed > 0) {
      const task = DB.getTasks().find(t => t.id === taskId);
      if (task) DB.addLog({ id: uid(), taskId, title: task.title, date: TODAY, category: task.category || null, startTime: state.startTime, endTime: Date.now(), duration: Math.max(1, Math.ceil(elapsed / 60)), scheduled: task.duration });
    }
  }
  DB.saveTimer(null);
}

function uncompleteTask(taskId) {
  const tasks = DB.getTasks();
  const task = tasks.find(t => t.id === taskId);
  if (task) { task.completed = false; task.skipped = false; delete task.actualDuration; DB.saveTasks(tasks); }
  closeSheet(); buildTimeline(); updateHeader(); renderStats();
}

function skipTask(taskId) {
  const tasks = DB.getTasks();
  const t = tasks.find(t => t.id === taskId);
  if (t) { t.skipped = true; DB.saveTasks(tasks); }
  closeSheet(); buildTimeline(); updateHeader();
}

function deleteTask(taskId) {
  if (!confirm('このタスクを削除しますか？')) return;
  DB.saveTasks(DB.getTasks().filter(t => t.id !== taskId));
  const s = DB.getTimer();
  if (s && s.taskId === taskId) {
    DB.saveTimer(null); clearInterval(timerTick);
    document.getElementById('activeBanner').classList.remove('visible');
  }
  closeSheet(); buildTimeline(); updateHeader();
}

// ===== SHEETS =====
function openTaskSheet(taskId) {
  const task = DB.getTasks().find(t => t.id === taskId);
  if (!task) return;
  const timer = DB.getTimer();
  const isRunning = timer && timer.taskId === taskId;
  const elapsed = isRunning ? Math.floor((Date.now() - timer.startTime) / 1000) : 0;
  const scheduled = isRunning ? (timer.scheduledSecs || task.duration * 60) : task.duration * 60;
  const remaining = scheduled - elapsed;
  const isOvertime = remaining < 0;
  const display = isRunning ? (isOvertime ? '+' + formatSecs(-remaining) : formatSecs(remaining)) : formatSecs(scheduled);

  let buttons = '';
  if (task.completed || task.skipped) {
    buttons = `<button class="btn btn-primary" onclick="uncompleteTask('${taskId}')">↩ 元に戻す</button>
               <button class="btn btn-skip" onclick="closeSheet()">閉じる</button>
               <button class="btn btn-muted" onclick="deleteTask('${taskId}')">削除</button>`;
  } else if (isRunning) {
    buttons = `<button class="btn btn-success" onclick="completeTask('${taskId}')">✓ 完了</button>
               <button class="btn btn-muted" onclick="closeSheet()">閉じる</button>`;
  } else {
    buttons = `<button class="btn btn-primary" onclick="startTask('${taskId}')">▶ 開始</button>
               <button class="btn btn-skip" onclick="skipTask('${taskId}')">スキップ</button>
               <button class="btn btn-muted" onclick="deleteTask('${taskId}')">削除</button>`;
  }

  const catPills = Object.entries(CATEGORIES).map(([key, c]) => {
    const sel = task.category === key;
    const style = sel
      ? `background:${c.color};color:white;border-color:${c.color}`
      : `border-color:${c.color};background:white;color:#888`;
    return `<button class="cat-pill" style="${style}"
      onclick="changeTaskCategory('${taskId}','${key}')" type="button">${c.label}</button>`;
  }).join('');

  document.getElementById('sheetContent').innerHTML = `
    <div class="sheet-title">${task.title}</div>
    <div class="sheet-subtitle">${task.scheduledTime} 開始 · 予定 ${task.duration}分</div>
    <div class="timer-display${isOvertime ? ' overtime' : ''}" id="sheetTimer">${display}</div>
    <div class="timer-label" id="timerLabel">${isRunning ? (isOvertime ? '超過中' : '残り時間') : '予定時間'}</div>
    <div style="margin-bottom:16px">
      <div style="font-size:11px;color:#bbb;font-weight:600;letter-spacing:0.3px;margin-bottom:6px">カテゴリ</div>
      <div class="cat-picker">${catPills}</div>
    </div>
    <div class="sheet-buttons">${buttons}</div>
  `;
  showOverlay();
  if (isRunning) startTicking();
}

function changeTaskCategory(taskId, newCat) {
  const tasks = DB.getTasks();
  const task = tasks.find(t => t.id === taskId);
  if (!task) return;

  // Toggle: click same category to clear
  task.category = task.category === newCat ? null : newCat;
  DB.saveTasks(tasks);

  // Sync all log entries for this task
  const log = DB.getLog();
  log.forEach(e => { if (e.taskId === taskId) e.category = task.category; });
  localStorage.setItem('dp_log', JSON.stringify(log));

  buildTimeline();
  renderStats();
  openTaskSheet(taskId);
}

function openAddSheet() {
  const now = new Date();
  const hh = now.getHours();
  const mm = Math.ceil(now.getMinutes() / 15) * 15;
  const adjH = mm >= 60 ? hh + 1 : hh;
  const adjM = mm >= 60 ? 0 : mm;
  const defaultTime = `${pad(adjH % 24)}:${pad(adjM)}`;

  const catOptions = Object.entries(CATEGORIES).map(([key, c]) =>
    `<button class="cat-pill" data-cat="${key}" style="border-color:${c.color}"
      onclick="selectCat(this)" type="button">${c.label}</button>`
  ).join('');

  document.getElementById('sheetContent').innerHTML = `
    <div class="sheet-title">タスクを追加</div>
    <div style="height:14px"></div>
    <div class="form-group">
      <label class="form-label">タスク名</label>
      <input type="text" class="form-input" id="newTitle" placeholder="何をしますか？" autofocus>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">開始時刻</label>
        <input type="time" class="form-input" id="newTime" value="${defaultTime}">
      </div>
      <div class="form-group">
        <label class="form-label">時間（分）</label>
        <input type="number" class="form-input" id="newDuration" value="30" min="5" max="480" step="5">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">カテゴリ（任意）</label>
      <div class="cat-picker">${catOptions}</div>
      <input type="hidden" id="newCategory" value="">
    </div>
    <div class="sheet-buttons" style="margin-top:16px">
      <button class="btn btn-primary" onclick="addTask()">追加</button>
      <button class="btn btn-muted" onclick="closeSheet()">キャンセル</button>
    </div>
  `;
  showOverlay();
  setTimeout(() => document.getElementById('newTitle')?.focus(), 50);
}

function selectCat(btn) {
  document.querySelectorAll('.cat-pill').forEach(b => {
    b.classList.remove('selected'); b.style.background = 'white'; b.style.color = '#888';
  });
  const cat = CATEGORIES[btn.dataset.cat];
  if (document.getElementById('newCategory').value === btn.dataset.cat) {
    document.getElementById('newCategory').value = '';
  } else {
    btn.classList.add('selected');
    btn.style.background = cat.color;
    btn.style.color = 'white';
    document.getElementById('newCategory').value = btn.dataset.cat;
  }
}

function addTask() {
  const title = document.getElementById('newTitle')?.value.trim();
  const time = document.getElementById('newTime')?.value;
  const duration = parseInt(document.getElementById('newDuration')?.value) || 30;
  const category = document.getElementById('newCategory')?.value || null;
  if (!title || !time) return;
  const tasks = DB.getTasks();
  tasks.push({ id: uid(), title, scheduledTime: time, duration, category, date: TODAY, completed: false, createdAt: Date.now() });
  DB.saveTasks(tasks);
  closeSheet(); buildTimeline(); updateHeader();
}

function showOverlay() { document.getElementById('overlay').classList.add('visible'); }
function closeSheet() { document.getElementById('overlay').classList.remove('visible'); }
function handleOverlayClick(e) { if (e.target === document.getElementById('overlay')) closeSheet(); }

// ===== DRAG =====
function addDragBehavior(block, taskId, initialTop) {
  block.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    const startMouseY = e.clientY;
    let currentTop = initialTop;
    let moved = false;

    const onMove = (e) => {
      const dy = e.clientY - startMouseY;
      if (!moved && Math.abs(dy) < 5) return;
      if (!moved) {
        moved = true;
        block.style.opacity = '0.82'; block.style.zIndex = '20';
        block.style.boxShadow = '0 6px 20px rgba(0,0,0,0.18)';
        block.style.cursor = 'grabbing'; block.style.transition = 'none';
        document.body.style.cursor = 'grabbing';
        document.body.style.userSelect = 'none';
      }
      const Z = PX_PER_MIN();
      const raw = Math.max(0, Math.min(1435 * Z, initialTop + dy));
      currentTop = Math.round(raw / (5 * Z)) * (5 * Z);
      block.style.top = currentTop + 'px';
      const meta = block.querySelector('.task-meta');
      if (meta) {
        const task = DB.getTasks().find(t => t.id === taskId);
        const mins = currentTop / Z;
        meta.textContent = `${pad(Math.floor(mins/60))}:${pad(Math.floor(mins)%60)} · ${task?.duration||30}分`;
      }
    };

    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.body.style.cursor = ''; document.body.style.userSelect = '';
      if (!moved) { openTaskSheet(taskId); return; }
      const Z2 = PX_PER_MIN();
      const mins2 = currentTop / Z2;
      const newTime = `${pad(Math.floor(mins2/60))}:${pad(Math.floor(mins2)%60)}`;
      const tasks = DB.getTasks();
      const task = tasks.find(t => t.id === taskId);
      if (task) { task.scheduledTime = newTime; DB.saveTasks(tasks); }
      buildTimeline();
    };

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

// ===== RESIZE =====
function addResizeBehavior(block, taskId, initialHeight) {
  const handle = mkEl('div', 'resize-handle');
  block.appendChild(handle);

  handle.addEventListener('mousedown', (e) => {
    e.stopPropagation(); e.preventDefault();
    const startY = e.clientY;
    const Z = PX_PER_MIN();
    let newDurMin = Math.round(initialHeight / Z);
    document.body.style.cursor = 'ns-resize';
    document.body.style.userSelect = 'none';

    const onMove = (e) => {
      const dy = e.clientY - startY;
      newDurMin = Math.max(15, Math.round((initialHeight + dy) / (5 * Z)) * 5);
      block.style.height = Math.max(28, newDurMin * Z) + 'px';
      const meta = block.querySelector('.task-meta');
      if (meta) {
        const task = DB.getTasks().find(t => t.id === taskId);
        if (task) meta.textContent = `${task.scheduledTime} · ${newDurMin}分`;
      }
    };

    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.body.style.cursor = ''; document.body.style.userSelect = '';
      const tasks = DB.getTasks();
      const task = tasks.find(t => t.id === taskId);
      if (task) { task.duration = newDurMin; DB.saveTasks(tasks); }
      buildTimeline();
    };

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

// ===== UTILS =====
function mkEl(tag, cls, html = '') {
  const e = document.createElement(tag);
  e.className = cls; if (html) e.innerHTML = html; return e;
}

// ===== INIT =====
buildTimeline();
updateHeader();
renderStats();
scrollToNow();

if (DB.getTimer()) startTicking();

setInterval(() => placeNowLine(), 60000);
</script>
