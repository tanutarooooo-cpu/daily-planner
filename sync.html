<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>インポート — プランナー</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: #f5f4f1;
      color: #1a1a1a;
      min-height: 100vh;
    }

    .header {
      padding: 14px 24px 10px;
      background: #fff;
      border-bottom: 1px solid #ece9e3;
    }
    .header-date { font-size: 11px; color: #aaa; }
    .header-title { font-size: 22px; font-weight: 800; }
    .header-sub { font-size: 12px; color: #999; margin-top: 1px; }

    .top-nav {
      display: flex;
      background: #fff;
      border-bottom: 1px solid #ece9e3;
    }
    .nav-item {
      flex: 1;
      padding: 10px 0 8px;
      text-align: center;
      text-decoration: none;
      color: #bbb;
      font-size: 12px;
      font-weight: 600;
      border-bottom: 2px solid transparent;
    }
    .nav-item.active { color: #52b788; border-bottom-color: #52b788; }
    .nav-item:hover:not(.active) { color: #888; }

    .content {
      padding: 20px 24px;
      max-width: 680px;
    }

    .section-title {
      font-size: 11px; color: #bbb; font-weight: 700;
      letter-spacing: 0.5px; margin-bottom: 8px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .card-title { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
    .card-desc { font-size: 12px; color: #888; line-height: 1.7; margin-bottom: 14px; }
    .card-desc code {
      background: #f0ede8;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 11px;
      font-family: 'Menlo', monospace;
    }

    textarea {
      width: 100%;
      border: 1.5px solid #e8e4dd;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      font-family: 'Menlo', 'Courier New', monospace;
      color: #444;
      background: #faf9f7;
      outline: none;
      resize: vertical;
      min-height: 110px;
      line-height: 1.6;
    }
    textarea:focus { border-color: #52b788; background: #fff; }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #52b788; color: white; }
    .btn-muted { background: #f0ede8; color: #888; }
    .btn-row { display: flex; gap: 8px; margin-top: 12px; }

    /* Parsed tasks */
    .parsed-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .parsed-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #faf9f7;
      border: 1.5px solid #e8e4dd;
      border-radius: 8px;
      padding: 8px 12px;
    }
    .parsed-item.deselected { opacity: 0.45; }
    .parsed-check {
      width: 20px; height: 20px;
      border: 2px solid #52b788;
      border-radius: 5px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 800;
    }
    .parsed-check.checked { background: #52b788; color: white; }
    .parsed-title {
      flex: 1; font-size: 13px; font-weight: 600;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      min-width: 0;
    }
    .parsed-inputs { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .time-input {
      width: 78px; padding: 5px 8px;
      border: 1.5px solid #e8e4dd; border-radius: 6px;
      font-size: 12px; text-align: center; outline: none;
      font-family: inherit; background: white;
    }
    .time-input:focus { border-color: #52b788; }
    .dur-input {
      width: 52px; padding: 5px 6px;
      border: 1.5px solid #e8e4dd; border-radius: 6px;
      font-size: 12px; text-align: center; outline: none;
      font-family: inherit; background: white;
    }
    .dur-input:focus { border-color: #52b788; }
    .dur-label { font-size: 11px; color: #bbb; }

    /* Result banner */
    .result-banner {
      display: none;
      background: #eaf5ee; border: 1.5px solid #74c69d;
      border-radius: 10px; padding: 12px 16px;
      margin-bottom: 16px; font-size: 13px;
      color: #2d6a4f; font-weight: 600;
    }
    .result-banner.visible { display: block; }

    /* Today task list */
    .task-row {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 0; border-bottom: 1px solid #f0ede8;
    }
    .task-row:last-child { border-bottom: none; }
    .task-row-body { flex: 1; min-width: 0; }
    .task-row-title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .task-row-meta { font-size: 11px; color: #bbb; margin-top: 1px; }
    .del-btn {
      background: none; border: none; color: #ddd;
      font-size: 15px; cursor: pointer; padding: 4px 6px;
      border-radius: 4px; flex-shrink: 0;
    }
    .del-btn:hover { color: #e74c3c; background: #fff0ef; }
    .empty-msg { font-size: 13px; color: #ccc; padding: 8px 0; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-date" id="headerDate"></div>
    <div class="header-title">インポート</div>
    <div class="header-sub">リマインドリストからタスクを取り込む</div>
  </div>

  <nav class="top-nav">
    <a class="nav-item" href="index.html">📅 Today</a>
    <a class="nav-item" href="log.html">📊 ログ</a>
    <a class="nav-item active" href="sync.html">📋 インポート</a>
  </nav>

  <div class="content">

    <div class="result-banner" id="resultBanner"></div>

    <!-- Reminder sync -->
    <div class="card" id="reminderSyncCard">
      <div class="card-title">✅ リマインドリストに反映</div>
      <div class="card-desc">
        今日完了したタスクを <code>_inbox/リマインドリスト.md</code> の
        <code>[ ]</code> → <code>[x]</code> に自動で書き換えます。<br>
        初回のみファイル選択が必要です。
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="syncCompleted()" id="syncBtn">
          📁 リマインドリスト.md を開いて反映
        </button>
      </div>
      <div id="syncResult" style="display:none;margin-top:14px;padding:12px;background:#faf9f7;border-radius:8px;font-size:13px;line-height:1.7"></div>
    </div>

    <!-- Step 1 -->
    <div class="card" id="step1Card">
      <div class="card-title">① リストを貼り付ける</div>
      <div class="card-desc">
        Claude Code に「今日のタスクをプランナー用に出力して」と頼み、出力された内容をそのまま貼り付けてください。<br>
        <code>- [ ] タスク名</code> 形式の行を自動で読み取ります。
      </div>
      <textarea id="pasteArea" placeholder="- [ ] メルマガを書く&#10;- [ ] Xポストを確認&#10;- [ ] 経理作業"></textarea>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="parseTasks()">読み取る →</button>
      </div>
    </div>

    <!-- Step 2: time assignment -->
    <div class="card" id="step2Card" style="display:none">
      <div class="card-title">② 時間を確認してインポート</div>
      <div class="card-desc">現在時刻から順番に並べています。必要に応じて調整してください。</div>
      <div class="parsed-list" id="parsedList"></div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="importTasks()">Today に追加</button>
        <button class="btn btn-muted" onclick="cancelParse()">キャンセル</button>
      </div>
    </div>

    <!-- Today task list -->
    <div class="card">
      <div class="card-title" style="margin-bottom:12px">今日のタスク一覧</div>
      <div id="todayTaskList"></div>
      <div class="btn-row" style="margin-top:12px">
        <button class="btn btn-muted" onclick="clearToday()">今日のタスクをすべて削除</button>
      </div>
    </div>

  </div>

<script>
const TODAY = new Date().toISOString().slice(0, 10);
const DB = {
  getTasks: () => JSON.parse(localStorage.getItem('dp_tasks') || '[]'),
  saveTasks: t => localStorage.setItem('dp_tasks', JSON.stringify(t)),
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pad = n => String(n).padStart(2, '0');

// Set header date
const now = new Date();
const days = ['日','月','火','水','木','金','土'];
document.getElementById('headerDate').textContent =
  `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}（${days[now.getDay()]}）`;

let parsedItems = [];

// ===== AUTO-STAGGER: start from current time, stack by duration =====
function buildSuggestedTimes(items) {
  const now = new Date();
  let cursor = now.getHours() * 60 + now.getMinutes();
  cursor = Math.ceil(cursor / 15) * 15; // round up to next 15-min slot

  return items.map(item => {
    const h = Math.floor(cursor / 60) % 24;
    const m = cursor % 60;
    const time = `${pad(h)}:${pad(m)}`;
    cursor += item.duration; // advance by this task's duration
    return time;
  });
}

function parseTasks() {
  const text = document.getElementById('pasteArea').value.trim();
  if (!text) return;

  const tasks = [];
  text.split('\n').forEach(line => {
    const t = line.trim();
    if (!t) return;
    // - [ ] or * [ ] (unchecked only)
    const cb = t.match(/^[-*]\s+\[ \]\s+(.+)$/);
    if (cb) { tasks.push(cleanTitle(cb[1])); return; }
    // - item or ・item
    const bl = t.match(/^[-・•]\s+(.+)$/);
    if (bl && !t.startsWith('---')) { tasks.push(cleanTitle(bl[1])); return; }
    // 1. item
    const nm = t.match(/^\d+[.)]\s+(.+)$/);
    if (nm) { tasks.push(cleanTitle(nm[1])); }
  });

  if (tasks.length === 0) {
    alert('タスクが見つかりませんでした。\n「- [ ] タスク名」または「- タスク名」形式で書いてください。');
    return;
  }

  // Build items with default duration first
  parsedItems = tasks.map(title => ({ id: uid(), title, selected: true, duration: 30 }));

  // Then assign staggered times based on durations
  const times = buildSuggestedTimes(parsedItems);
  parsedItems.forEach((item, i) => { item.time = times[i]; });

  renderParsedList();
  document.getElementById('step2Card').style.display = 'block';
  document.getElementById('step2Card').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function cleanTitle(s) {
  return s.replace(/（[^）]*）$/, '').replace(/\([^)]*\)$/, '').replace(/【[^】]*】/, '').trim();
}

function renderParsedList() {
  document.getElementById('parsedList').innerHTML = parsedItems.map((item, i) => `
    <div class="parsed-item${item.selected ? '' : ' deselected'}" id="pi_${i}">
      <div class="parsed-check${item.selected ? ' checked' : ''}" onclick="toggleItem(${i})">${item.selected ? '✓' : ''}</div>
      <div class="parsed-title" title="${item.title}">${item.title}</div>
      <div class="parsed-inputs">
        <input type="time" class="time-input" value="${item.time}"
               onchange="updateItem(${i}, 'time', this.value)">
        <input type="number" class="dur-input" value="${item.duration}" min="5" max="480" step="5"
               onchange="updateItem(${i}, 'duration', parseInt(this.value)||30); recalcTimes(${i})">
        <span class="dur-label">分</span>
      </div>
    </div>
  `).join('');
}

function toggleItem(i) {
  parsedItems[i].selected = !parsedItems[i].selected;
  renderParsedList();
}

function updateItem(i, key, val) {
  parsedItems[i][key] = val;
}

// When duration changes, recalculate times for subsequent tasks
function recalcTimes(changedIndex) {
  // Recalculate from changedIndex+1 onwards based on previous task's time + duration
  for (let i = changedIndex + 1; i < parsedItems.length; i++) {
    const prev = parsedItems[i - 1];
    const [ph, pm] = prev.time.split(':').map(Number);
    const newCursor = ph * 60 + pm + (prev.duration || 30);
    const h = Math.floor(newCursor / 60) % 24;
    const m = newCursor % 60;
    parsedItems[i].time = `${pad(h)}:${pad(m)}`;
  }
  renderParsedList();
}

function importTasks() {
  const selected = parsedItems.filter(p => p.selected);
  if (selected.length === 0) { alert('タスクを1件以上選択してください。'); return; }

  const tasks = DB.getTasks();
  selected.forEach(item => {
    tasks.push({
      id: item.id, title: item.title,
      scheduledTime: item.time, duration: item.duration,
      date: TODAY, completed: false, createdAt: Date.now()
    });
  });
  DB.saveTasks(tasks);

  document.getElementById('step2Card').style.display = 'none';
  document.getElementById('pasteArea').value = '';
  parsedItems = [];

  const b = document.getElementById('resultBanner');
  b.textContent = `✓ ${selected.length}件を Today に追加しました`;
  b.classList.add('visible');
  setTimeout(() => b.classList.remove('visible'), 4000);

  renderTodayTasks();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelParse() {
  document.getElementById('step2Card').style.display = 'none';
  parsedItems = [];
}

function renderTodayTasks() {
  const tasks = DB.getTasks().filter(t => t.date === TODAY)
    .sort((a, b) => a.scheduledTime.localeCompare(b.scheduledTime));
  const el = document.getElementById('todayTaskList');
  if (tasks.length === 0) {
    el.innerHTML = '<div class="empty-msg">今日のタスクはありません</div>';
    return;
  }
  el.innerHTML = tasks.map(t => `
    <div class="task-row">
      <div class="task-row-body">
        <div class="task-row-title">${t.title}</div>
        <div class="task-row-meta">${t.scheduledTime} · ${t.duration}分 ${t.completed ? '✓ 完了' : t.skipped ? '— スキップ' : ''}</div>
      </div>
      <button class="del-btn" onclick="deleteTask('${t.id}')" title="削除">✕</button>
    </div>
  `).join('');
}

function deleteTask(id) {
  DB.saveTasks(DB.getTasks().filter(t => t.id !== id));
  renderTodayTasks();
}

function clearToday() {
  if (!confirm('今日のタスクをすべて削除しますか？')) return;
  DB.saveTasks(DB.getTasks().filter(t => t.date !== TODAY));
  renderTodayTasks();
}

renderTodayTasks();

// ===== REMINDER SYNC (File System Access API) =====
let reminderFileHandle = null;

async function syncCompleted() {
  if (!window.showOpenFilePicker) {
    alert('このブラウザはファイル直接書き込みに対応していません。\nChrome または Edge をお使いください。');
    return;
  }

  try {
    // Request file handle if not yet obtained (or permission lost)
    if (!reminderFileHandle) {
      const handles = await window.showOpenFilePicker({
        types: [{ description: 'Markdown', accept: { 'text/plain': ['.md'] } }],
      });
      reminderFileHandle = handles[0];
      document.getElementById('syncBtn').textContent = '🔄 リマインドリストに反映';
    }

    // Ensure readwrite permission
    let perm = await reminderFileHandle.queryPermission({ mode: 'readwrite' });
    if (perm !== 'granted') {
      perm = await reminderFileHandle.requestPermission({ mode: 'readwrite' });
      if (perm !== 'granted') { showSyncResult('error', 'ファイルへの書き込み権限がありません。'); return; }
    }

    // Read file
    const file = await reminderFileHandle.getFile();
    let content = await file.text();
    const lines = content.split('\n');

    // Get completed tasks for today
    const completedTasks = DB.getTasks().filter(t => t.date === TODAY && t.completed);
    if (completedTasks.length === 0) {
      showSyncResult('warn', '今日完了したタスクがありません。');
      return;
    }

    const matched = [];
    const unmatched = [];

    completedTasks.forEach(task => {
      const titleKey = stripAnnotations(task.title).slice(0, 14); // compare leading 14 chars
      let found = false;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        // Only target unchecked items
        if (!line.match(/^[-*]\s+\[ \]/)) continue;
        const lineText = stripAnnotations(line.replace(/^[-*]\s+\[ \]\s*/, ''));
        if (lineText.startsWith(titleKey) || lineText.includes(titleKey)) {
          lines[i] = line.replace('[ ]', '[x]');
          found = true;
          matched.push(task.title);
          break;
        }
      }
      if (!found) unmatched.push(task.title);
    });

    if (matched.length > 0) {
      const writable = await reminderFileHandle.createWritable();
      await writable.write(lines.join('\n'));
      await writable.close();
    }

    // Build result HTML
    let html = '';
    if (matched.length > 0) {
      html += `<div style="color:#2d6a4f;font-weight:700;margin-bottom:6px">✓ ${matched.length}件を [x] に更新しました</div>`;
      matched.forEach(t => html += `<div style="color:#555;padding:1px 0">　✓ ${t}</div>`);
    }
    if (unmatched.length > 0) {
      html += `<div style="color:#e67e22;font-weight:700;margin:10px 0 6px">⚠ ${unmatched.length}件はリストに見つかりませんでした</div>`;
      unmatched.forEach(t => html += `<div style="color:#aaa;padding:1px 0">　— ${t}</div>`);
      html += `<div style="font-size:11px;color:#bbb;margin-top:6px">タスク名がリマインドリストの表記と異なる場合は手動で更新してください。</div>`;
    }
    showSyncResult('ok', html);

  } catch (err) {
    if (err.name !== 'AbortError') showSyncResult('error', 'エラー: ' + err.message);
  }
}

function stripAnnotations(s) {
  return s
    .replace(/\*\*/g, '')
    .replace(/（[^）]*）/g, '')
    .replace(/\([^)]*\)/g, '')
    .replace(/【[^】]*】/g, '')
    .replace(/→.*/g, '')
    .replace(/⚠.*/, '')
    .trim();
}

function showSyncResult(type, html) {
  const el = document.getElementById('syncResult');
  el.style.display = 'block';
  el.style.borderLeft = type === 'ok' ? '3px solid #52b788' : type === 'warn' ? '3px solid #f39c12' : '3px solid #e74c3c';
  el.innerHTML = html;
}
</script>
</body>
</html>
